<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Силуэт человека</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b110e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 220px;
            height: 400px;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 220 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background-color: #111a14;">
          <!-- ТЕМНАЯ ВЕРСИЯ (Фоновый силуэт) -->
          <g id="personDark" style="opacity: 0.25;">
            <circle cx="110" cy="55" r="32" fill="#88998f"/>
            <!-- Торс с широкими плечами -->
            <path d="M 72 105 L 148 105 L 146 260 L 115 260 L 110 240 L 105 260 L 74 260 Z" fill="#88998f"/>
            <!-- Ноги -->
            <path d="M 74 250 L 104 250 L 104 360 L 74 360 Z M 116 250 L 146 250 L 146 360 L 116 360 Z" fill="#88998f"/>
            <!-- Левая рука -->
            <path d="M 72 110 L 50 175 L 58 240" stroke="#88998f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- Правая рука -->
            <path d="M 148 110 L 170 175 L 162 240" stroke="#88998f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>

          <!-- СВЕТЛАЯ ВЕРСИЯ (Активный силуэт с исправленными плечами) -->
          <g id="personLight">
            <circle cx="110" cy="55" r="32" fill="#f2f2ea"/>
            <!-- Торс с нормальными широкими плечами -->
            <path d="M 72 105 L 148 105 L 146 260 L 115 260 L 110 240 L 105 260 L 74 260 Z" fill="#f2f2ea"/>
            <!-- Ноги -->
            <path d="M 74 250 L 104 250 L 104 360 L 74 360 Z M 116 250 L 146 250 L 146 360 L 116 360 Z" fill="#f2f2ea"/>
            <!-- Левая рука -->
            <path d="M 72 110 L 50 175 L 58 240" stroke="#f2f2ea" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- Правая рука -->
            <path d="M 148 110 L 170 175 L 162 240" stroke="#f2f2ea" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </g>
        </svg>
    </div>

</body>
</html>
