<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHR Debates</title>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-color: #070c08;
            --card-bg: #0f1711;
            --panel-bg: #141f17;
            --border-color: #243527;
            --gold: #e5c158;
            --gold-hover: #d4af37;
            --text-main: #ececec;
            --text-muted: #9aa89c;
            --btn-green: #2ecc71;
            --btn-red: #e74c3c;
            --btn-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Навигация */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(15, 23, 17, 0.9);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--gold);
        }

        /* Контейнер лобби */
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .section-title {
            font-size: 28px;
            color: var(--text-main);
            margin-bottom: 25px;
            text-align: center;
        }

        .debates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .debate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .debate-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .debate-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .scores-view {
            display: flex;
            justify-content: space-between;
            background: #090e09;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 1px solid var(--gold);
            border-radius: 16px;
            padding: 35px 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .modal-card h2 {
            font-size: 32px;
            color: var(--text-main);
            margin-bottom: 20px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-sub {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
        }

        .stat-val {
            font-size: 26px;
            font-weight: bold;
            color: var(--gold);
        }

        .stat-lbl {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .btn-gold {
            background: var(--gold);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-gold:hover {
            background: var(--gold-hover);
        }

        /* Панель администратора */
        .admin-modal {
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
        }

        .admin-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .admin-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        input[type="text"], input[type="number"], input[type="password"] {
            background: #080d09;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"] { flex: 1; }
        input[type="number"] { width: 70px; text-align: center; }

        .btn-action {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-start { background: var(--btn-green); }
        .btn-stop { background: var(--btn-red); }
        .btn-win { background: var(--btn-blue); }
        .btn-delete { background: #c0392b; margin-left: auto; }
        .btn-sm { padding: 4px 10px; border-radius: 6px; }

        .admin-room-card {
            background: #0a110c;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .admin-room-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .admin-room-status {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 12px;
        }

        .admin-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .admin-score-group {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .score-ctrl {
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">MEHR</a>
        <div class="nav-links">
    <span class="nav-link" onclick="openProfile()">Мой Профиль</span>
    <a href="index.html" class="nav-link">На главную</a>
</div>
    </header>

    <main>
        <h1 class="section-title">Комнаты Дебатов</h1>
        <div class="debates-grid" id="debatesGrid">
            <!-- Список комнат будет рендериться динамически -->
        </div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО: ЛИЧНЫЙ ПРОФИЛЬ -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <h2>Личный Профиль</h2>
            <div class="profile-name" id="profName">Зиё</div>
            <div class="profile-sub">Участник платформы Mehr Debates</div>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="profDebates">0</div>
                    <div class="stat-lbl">Участий в дебатах</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="profWins">0</div>
                    <div class="stat-lbl">Побед</div>
                </div>
            </div>

            <button class="btn-gold" onclick="closeProfile()">Назад к лобби</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: АВТОРИЗАЦИЯ АДМИНА -->
    <div class="modal-overlay" id="adminAuthModal">
        <div class="modal-card" style="max-width: 380px;">
            <h2 style="font-size: 24px; margin-bottom: 15px;">Вход в Админку</h2>
            <input type="password" id="adminPassInput" placeholder="Введите пароль" style="width: 100%; margin-bottom: 15px;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-gold" onclick="checkAdminPass()">Войти</button>
                <button class="btn-gold" style="background: #333; color: #fff;" onclick="closeAdminAuth()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card admin-modal">
            <h2 style="text-align: center; margin-bottom: 20px;">Панель Управления</h2>
            
            <!-- Добавить новую тему -->
            <div class="admin-section">
                <h3>➕ Добавить новую тему</h3>
                <div class="form-row">
                    <input type="text" id="newTopicTitle" placeholder="Введите тему дебатов...">
                    <input type="number" id="newTopicLimit" value="10" placeholder="Лимит">
                    <button class="btn-action btn-start" onclick="createTopic()">Создать</button>
                </div>
            </div>

            <!-- Управление комнатами -->
            <div class="admin-section">
                <h3>⚡ Управление комнатами (Статусы и Победители)</h3>
                <div id="adminRoomsList">
                    <!-- Загружается из JS -->
                </div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn-gold" style="background: #1f2921; color: #fff; border: 1px solid var(--border-color);" onclick="closeAdmin()">Закрыть админку</button>
            </div>
        </div>
    </div>

    <script>
       // Вход по 5 быстрым кликам на логотип "MEHR"
let logoClicks = 0;
let logoTimer;
let navTimer;

document.querySelector('.logo').addEventListener('click', function(e) {
    e.preventDefault(); // Отменяем мгновенный переход по ссылке при любом клике

    logoClicks++;
    clearTimeout(logoTimer);
    clearTimeout(navTimer);

    if (logoClicks >= 5) {
        logoClicks = 0;
        openAdminAuth();
    } else {
        // Сброс счетчика кликов
        logoTimer = setTimeout(() => {
            logoClicks = 0;
        }, 1000);

        // Если новых кликов нет — переходим на главную через 350 мс
        navTimer = setTimeout(() => {
            window.location.href = 'index.html';
        }, 350);
    }
});

// Вход по сочетанию клавиш (Ctrl + Shift + A)
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.shiftKey && (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф')) {
        e.preventDefault();
        openAdminAuth();
    }
});
        // Инициализация Firebase (Замените своими ключами при необходимости)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            storageBucket: "YOUR_PROJECT.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        // Локальное хранилище-заглушка на случай отсутствии подключения к Firebase
        let debatesData = JSON.parse(localStorage.getItem('mehr_debates')) || [
            {
                id: '1',
                title: 'Оценки в школе не отражают реальных знаний',
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: 10
            },
            {
                id: '2',
                title: 'Социальные сети приносят больше вреда, чем пользы',
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: 10
            },
            {
                id: '3',
                title: 'ИИ заменит большинство профессий через 10 лет',
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: 10
            }
        ];

        function saveData() {
            localStorage.setItem('mehr_debates', JSON.stringify(debatesData));
            render();
        }

        // Рендер главного лобби и админки
        function render() {
            renderLobby();
            renderAdmin();
        }

        function renderLobby() {
            const grid = document.getElementById('debatesGrid');
            grid.innerHTML = '';
            
            debatesData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'debate-card';
                card.innerHTML = `
                    <div>
                        <div class="debate-title">${item.title}</div>
                        <div class="debate-meta">Статус: <b>${item.status}</b> | Победитель: <b>${item.winner}</b></div>
                    </div>
                    <div class="scores-view">
                        <span>🛡️ Защита: ${item.scoreDef}</span>
                        <span>⚔️ Атака: ${item.scoreAtk}</span>
                    </div>
                    <button class="btn-gold" style="width: 100%; font-size: 14px; padding: 10px;">Присоединиться</button>
                `;
                grid.appendChild(card);
            });
        }

        function renderAdmin() {
            const list = document.getElementById('adminRoomsList');
            list.innerHTML = '';

            debatesData.forEach(item => {
                const room = document.createElement('div');
                room.className = 'admin-room-card';
                room.innerHTML = `
                    <div class="admin-room-title">${item.title}</div>
                    <div class="admin-room-status">Статус: <b>${item.status}</b> | Победитель: <b>${item.winner}</b></div>
                    
                    <div class="admin-btn-group">
                        <button class="btn-action btn-start" onclick="setStatus('${item.id}', 'Идет')">⚡ Начать дебат</button>
                        <button class="btn-action btn-stop" onclick="setStatus('${item.id}', 'Завершен')">🏁 Завершить</button>
                        <button class="btn-action btn-win" onclick="setWinner('${item.id}', 'Защита')">🏆 Победитель: Защита</button>
                        <button class="btn-action btn-win" onclick="setWinner('${item.id}', 'Атака')">🏆 Победитель: Атака</button>
                    </div>

                    <div class="admin-score-group">
                        <div class="score-ctrl">
                            🛡️ Защита: <b>${item.scoreDef}</b>
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'def', 1)">+</button>
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'def', -1)">-</button>
                        </div>
                        <div class="score-ctrl">
                            ⚔️ Атака: <b>${item.scoreAtk}</b>
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'atk', 1)">+</button>
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'atk', -1)">-</button>
                        </div>
                        <button class="btn-action btn-delete" onclick="deleteTopic('${item.id}')">Удалить</button>
                    </div>
                `;
                list.appendChild(room);
            });
        }

        // Операции панели управления
        function createTopic() {
            const titleInput = document.getElementById('newTopicTitle');
            const limitInput = document.getElementById('newTopicLimit');
            
            if (!titleInput.value.trim()) return;

            const newRoom = {
                id: Date.now().toString(),
                title: titleInput.value.trim(),
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: parseInt(limitInput.value) || 10
            };

            debatesData.push(newRoom);
            titleInput.value = '';
            saveData();
        }

        function setStatus(id, status) {
            const item = debatesData.find(d => d.id === id);
            if (item) {
                item.status = status;
                saveData();
            }
        }

        function setWinner(id, winner) {
            const item = debatesData.find(d => d.id === id);
            if (item) {
                item.winner = winner;
                item.status = 'Завершен';
                saveData();
            }
        }

        function changeScore(id, type, delta) {
            const item = debatesData.find(d => d.id === id);
            if (item) {
                if (type === 'def') item.scoreDef = Math.max(0, item.scoreDef + delta);
                if (type === 'atk') item.scoreAtk = Math.max(0, item.scoreAtk + delta);
                saveData();
            }
        }

        function deleteTopic(id) {
            debatesData = debatesData.filter(d => d.id !== id);
            saveData();
        }

        // Управление модальными окнами
        function openProfile() { document.getElementById('profileModal').classList.add('active'); }
        function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }

        function openAdminAuth() { document.getElementById('adminAuthModal').classList.add('active'); }
        function closeAdminAuth() { 
            document.getElementById('adminAuthModal').classList.remove('active');
            document.getElementById('adminPassInput').value = '';
        }

        function checkAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            // Стандартный пароль админа: admin123
            if (pass === 'admin123' || pass === 'admin') {
                closeAdminAuth();
                document.getElementById('adminModal').classList.add('active');
            } else {
                alert('Неверный пароль администратора!');
            }
        }

        function closeAdmin() { document.getElementById('adminModal').classList.remove('active'); }

        // Первичная отрисовка
        render();
    </script>
</body>
</html>
