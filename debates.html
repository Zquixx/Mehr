<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEHR Debates — Комнаты</title>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <style>
        :root {
            --bg-color: #070c08;
            --card-bg: #0f1711;
            --panel-bg: #141f17;
            --border-color: #243527;
            --gold: #e5c158;
            --gold-hover: #d4af37;
            --text-main: #ececec;
            --text-muted: #9aa89c;
            --btn-green: #2ecc71;
            --btn-red: #e74c3c;
            --btn-blue: #3498db;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Навигация */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 40px;
            background: rgba(15, 23, 17, 0.9);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .nav-link {
            color: var(--text-main);
            text-decoration: none;
            font-size: 15px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: var(--gold);
        }

        /* Лобби */
        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .section-title {
            font-size: 28px;
            color: var(--text-main);
            margin-bottom: 25px;
            text-align: center;
        }

        .debates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .debate-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .debate-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .debate-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .scores-view {
            display: flex;
            justify-content: space-between;
            background: #090e09;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .btn-gold {
            background: var(--gold);
            color: #000;
            font-weight: 700;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            transition: background 0.2s;
        }

        .btn-gold:hover {
            background: var(--gold-hover);
        }

        /* Модальные окна общие */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-card {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 35px 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* ИНТЕРФЕЙС АРЕНЫ ДЕБАТОВ (РАЗДЕЛЕНИЕ КОМАНД) */
        .arena-card {
            background: #0d150e;
            border: 1px solid rgba(229, 193, 88, 0.25);
            border-radius: 18px;
            padding: 30px 25px;
            width: 92%;
            max-width: 780px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        .arena-title {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 25px;
            line-height: 1.3;
        }

        .teams-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .team-box {
            background: #09100a;
            border-radius: 14px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 220px;
        }

        .team-box.defenders {
            border: 1.5px solid #2b7fff;
        }

        .team-box.attackers {
            border: 1.5px solid #ef4444;
        }

        .team-header {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .team-header.def { color: #3b82f6; }
        .team-header.atk { color: #f87171; }

        .btn-team {
            width: 100%;
            padding: 12px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn-team:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .btn-def {
            background: #3b82f6;
            color: #fff;
        }

        .btn-atk {
            background: #ef4444;
            color: #fff;
        }

        .members-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .member-pill {
            background: #131f15;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            font-weight: 600;
            color: #ececec;
            text-align: center;
        }

        .btn-leave {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 28px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-leave:hover {
            background: rgba(255,255,255,0.05);
        }

        /* Админка styling */
        .admin-modal {
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            text-align: left;
        }

        .admin-section {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .admin-section h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row { display: flex; gap: 10px; }

        input[type="text"], input[type="number"], input[type="password"] {
            background: #080d09;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            outline: none;
        }

        input[type="text"] { flex: 1; }
        input[type="number"] { width: 70px; text-align: center; }

        .btn-action {
            padding: 8px 14px;
            border-radius: 20px;
            border: none;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            color: #fff;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-start { background: var(--btn-green); }
        .btn-stop { background: var(--btn-red); }
        .btn-win { background: var(--btn-blue); }
        .btn-delete { background: #c0392b; margin-left: auto; }
        .btn-sm { padding: 4px 10px; border-radius: 6px; }

        .admin-room-card {
            background: #0a110c;
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
        }

        .stat-val {
            font-size: 26px;
            font-weight: bold;
            color: var(--gold);
        }

        .stat-lbl {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .teams-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">MEHR</a>
        <div class="nav-links">
            <span class="nav-link" onclick="openProfile()">Мой Профиль</span>
            <a href="index.html" class="nav-link">На главную</a>
        </div>
    </header>

    <main>
        <h1 class="section-title">Комнаты Дебатов</h1>
        <div class="debates-grid" id="debatesGrid"></div>
    </main>

    <!-- МОДАЛЬНОЕ ОКНО: АРЕНА ДЕБАТОВ С РАЗДЕЛЕНИЕМ (ЗАЩИТА / АТАКА) -->
    <div class="modal-overlay" id="arenaModal">
        <div class="arena-card">
            <h2 class="arena-title" id="arenaRoomTitle">Тема дебатов</h2>
            
            <div class="teams-container">
                <!-- Сторона Защиты -->
                <div class="team-box defenders">
                    <div class="team-header def">🛡️ ЗАЩИТА (Protect)</div>
                    <button class="btn-team btn-def" onclick="joinTeam('defenders')">Встать на защиту</button>
                    <div class="members-list" id="defendersList"></div>
                </div>

                <!-- Сторона Атаки -->
                <div class="team-box attackers">
                    <div class="team-header atk">⚔️ ATAKA (Attack)</div>
                    <button class="btn-team btn-atk" onclick="joinTeam('attackers')">Перейти в атаку</button>
                    <div class="members-list" id="attackersList"></div>
                </div>
            </div>

            <button class="btn-leave" onclick="closeArena()">Выйти в лобби</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ЛИЧНЫЙ ПРОФИЛЬ -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-card">
            <h2 style="font-size: 24px; color: var(--gold); margin-bottom: 10px;">Личный Профиль</h2>
            <div style="font-size: 22px; font-weight: bold; margin-bottom: 5px;" id="profName">Ziyod</div>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Участник платформы Mehr Debates</p>
            
            <div class="stats-grid">
                <div class="stat-box">
                    <div class="stat-val" id="profDebates">0</div>
                    <div class="stat-lbl">Участий в дебатах</div>
                </div>
                <div class="stat-box">
                    <div class="stat-val" id="profWins">0</div>
                    <div class="stat-lbl">Побед</div>
                </div>
            </div>

            <button class="btn-gold" onclick="closeProfile()">Назад к лобби</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: АВТОРИЗАЦИЯ АДМИНА -->
    <div class="modal-overlay" id="adminAuthModal">
        <div class="modal-card" style="max-width: 380px;">
            <h2 style="font-size: 22px; margin-bottom: 15px;">Вход в Админку</h2>
            <input type="password" id="adminPassInput" placeholder="Введите пароль" style="width: 100%; margin-bottom: 15px;">
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn-gold" onclick="checkAdminPass()">Войти</button>
                <button class="btn-gold" style="background: #333; color: #fff;" onclick="closeAdminAuth()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО: ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="modal-overlay" id="adminModal">
        <div class="modal-card admin-modal">
            <h2 style="text-align: center; margin-bottom: 20px; font-size: 24px;">Панель Управления</h2>
            
            <div class="admin-section">
                <h3>➕ Добавить новую тему</h3>
                <div class="form-row">
                    <input type="text" id="newTopicTitle" placeholder="Введите тему дебатов...">
                    <input type="number" id="newTopicLimit" value="10" placeholder="Лимит">
                    <button class="btn-action btn-start" onclick="createTopic()">Создать</button>
                </div>
            </div>

            <div class="admin-section">
                <h3>⚡ Управление комнатами (Статусы и Победители)</h3>
                <div id="adminRoomsList"></div>
            </div>

            <div style="text-align: center; margin-top: 20px;">
                <button class="btn-gold" style="background: #1f2921; color: #fff; border: 1px solid var(--border-color);" onclick="closeAdmin()">Закрыть админку</button>
            </div>
        </div>
    </div>

    <script>
        let currentRoomId = null;
        let currentUser = localStorage.getItem('mehr_username') || 'Zquixx';

        // Переход в админку по 5 кликам на логотип
        let logoClicks = 0;
        let logoTimer, navTimer;

        document.querySelector('.logo').addEventListener('click', function(e) {
            e.preventDefault();
            logoClicks++;
            clearTimeout(logoTimer);
            clearTimeout(navTimer);

            if (logoClicks >= 5) {
                logoClicks = 0;
                openAdminAuth();
            } else {
                logoTimer = setTimeout(() => { logoClicks = 0; }, 1000);
                navTimer = setTimeout(() => { window.location.href = 'index.html'; }, 350);
            }
        });

        // Сочетание клавиш Ctrl + Shift + A для админки
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && (e.key === 'a' || e.key === 'A' || e.key === 'ф' || e.key === 'Ф')) {
                e.preventDefault();
                openAdminAuth();
            }
        });

        // Хранилище дебатов с поддержкой списков участников
        let debatesData = JSON.parse(localStorage.getItem('mehr_debates')) || [
            {
                id: '1',
                title: 'Should it be illegal to resell concert tickets for more than the original price?',
                status: 'Идет',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: 10,
                defenders: ['Zquixx'],
                attackers: ['Zquixx 2']
            },
            {
                id: '2',
                title: 'ИИ заменит большинство профессий через 10 лет',
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: 10,
                defenders: ['Zquixx'],
                attackers: ['Zquixx 2']
            },
            {
                id: '3',
                title: 'Should homework be abolished in schools?',
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: 10,
                defenders: [],
                attackers: []
            }
        ];

        function saveData() {
            localStorage.setItem('mehr_debates', JSON.stringify(debatesData));
            render();
            if (currentRoomId) renderArena();
        }

        function render() {
            renderLobby();
            renderAdmin();
        }

        function renderLobby() {
            const grid = document.getElementById('debatesGrid');
            grid.innerHTML = '';
            
            debatesData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'debate-card';
                card.innerHTML = `
                    <div>
                        <div class="debate-title">${item.title}</div>
                        <div class="debate-meta">Статус: <b>${item.status}</b> | Победитель: <b>${item.winner}</b></div>
                    </div>
                    <div class="scores-view">
                        <span>🛡️ Защита: ${(item.defenders || []).length}</span>
                        <span>⚔️ Атака: ${(item.attackers || []).length}</span>
                    </div>
                    <button class="btn-gold" style="width: 100%; font-size: 14px; padding: 10px;" onclick="openArena('${item.id}')">Присоединиться</button>
                `;
                grid.appendChild(card);
            });
        }

        /* --- ЛОГИКА АРЕНЫ ДЕБАТОВ --- */
        function openArena(id) {
            currentRoomId = id;
            document.getElementById('arenaModal').classList.add('active');
            renderArena();
        }

        function closeArena() {
            currentRoomId = null;
            document.getElementById('arenaModal').classList.remove('active');
        }

        function renderArena() {
            const room = debatesData.find(d => d.id === currentRoomId);
            if (!room) return;

            document.getElementById('arenaRoomTitle').innerText = room.title;

            const defContainer = document.getElementById('defendersList');
            const atkContainer = document.getElementById('attackersList');

            defContainer.innerHTML = '';
            atkContainer.innerHTML = '';

            (room.defenders || []).forEach(name => {
                const pill = document.createElement('div');
                pill.className = 'member-pill';
                pill.innerText = name;
                defContainer.appendChild(pill);
            });

            (room.attackers || []).forEach(name => {
                const pill = document.createElement('div');
                pill.className = 'member-pill';
                pill.innerText = name;
                atkContainer.appendChild(pill);
            });
        }

        function joinTeam(team) {
            const room = debatesData.find(d => d.id === currentRoomId);
            if (!room) return;

            if (!room.defenders) room.defenders = [];
            if (!room.attackers) room.attackers = [];

            // Удаляем пользователя из обеих команд перед входом
            room.defenders = room.defenders.filter(u => u !== currentUser);
            room.attackers = room.attackers.filter(u => u !== currentUser);

            // Добавляем в выбранную команду
            if (team === 'defenders') {
                room.defenders.push(currentUser);
            } else if (team === 'attackers') {
                room.attackers.push(currentUser);
            }

            saveData();
        }

        /* --- АДМИН ПАНЕЛЬ --- */
        function renderAdmin() {
            const list = document.getElementById('adminRoomsList');
            if (!list) return;
            list.innerHTML = '';

            debatesData.forEach(item => {
                const room = document.createElement('div');
                room.className = 'admin-room-card';
                room.innerHTML = `
                    <div style="font-weight: bold; margin-bottom: 6px;">${item.title}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;">Статус: <b>${item.status}</b> | Победитель: <b>${item.winner}</b></div>
                    
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px;">
                        <button class="btn-action btn-start" onclick="setStatus('${item.id}', 'Идет')">⚡ Начать</button>
                        <button class="btn-action btn-stop" onclick="setStatus('${item.id}', 'Завершен')">🏁 Завершить</button>
                        <button class="btn-action btn-win" onclick="setWinner('${item.id}', 'Защита')">🏆 Победа: Защита</button>
                        <button class="btn-action btn-win" onclick="setWinner('${item.id}', 'Атака')">🏆 Победа: Атака</button>
                    </div>

                    <div style="display: flex; gap: 15px; font-size: 14px; align-items: center;">
                        <span>🛡️ ${item.scoreDef} 
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'def', 1)">+</button>
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'def', -1)">-</button>
                        </span>
                        <span>⚔️ ${item.scoreAtk} 
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'atk', 1)">+</button>
                            <button class="btn-action btn-sm" style="background:#333;" onclick="changeScore('${item.id}', 'atk', -1)">-</button>
                        </span>
                        <button class="btn-action btn-delete" onclick="deleteTopic('${item.id}')">Удалить</button>
                    </div>
                `;
                list.appendChild(room);
            });
        }

        function createTopic() {
            const titleInput = document.getElementById('newTopicTitle');
            const limitInput = document.getElementById('newTopicLimit');
            if (!titleInput.value.trim()) return;

            debatesData.push({
                id: Date.now().toString(),
                title: titleInput.value.trim(),
                status: 'Ожидание',
                winner: 'Нет',
                scoreDef: 0,
                scoreAtk: 0,
                limit: parseInt(limitInput.value) || 10,
                defenders: [],
                attackers: []
            });
            titleInput.value = '';
            saveData();
        }

        function setStatus(id, status) {
            const item = debatesData.find(d => d.id === id);
            if (item) { item.status = status; saveData(); }
        }

        function setWinner(id, winner) {
            const item = debatesData.find(d => d.id === id);
            if (item) { item.winner = winner; item.status = 'Завершен'; saveData(); }
        }

        function changeScore(id, type, delta) {
            const item = debatesData.find(d => d.id === id);
            if (item) {
                if (type === 'def') item.scoreDef = Math.max(0, item.scoreDef + delta);
                if (type === 'atk') item.scoreAtk = Math.max(0, item.scoreAtk + delta);
                saveData();
            }
        }

        function deleteTopic(id) {
            debatesData = debatesData.filter(d => d.id !== id);
            saveData();
        }

        function openProfile() { document.getElementById('profileModal').classList.add('active'); }
        function closeProfile() { document.getElementById('profileModal').classList.remove('active'); }
        function openAdminAuth() { document.getElementById('adminAuthModal').classList.add('active'); }
        function closeAdminAuth() { document.getElementById('adminAuthModal').classList.remove('active'); }

        function checkAdminPass() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === '20108586' || pass === 'admin123' || pass === 'admin') {
                closeAdminAuth();
                document.getElementById('adminModal').classList.add('active');
            } else {
                alert('Неверный пароль администратора!');
            }
        }

        function closeAdmin() { document.getElementById('adminModal').classList.remove('active'); }

        render();
    </script>
</body>
</html>
